spring.application.name=todobarato

#configuración del servidor
server.port = 8080
server.servlet.context-path=/api/v1
#conexión a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/todobarato?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.drivers-class-name=com.mysql.cj.jdbc.Driver
#configuración a JPA
spring.jpa.hibernate.ddl-auto=none
#configuracion de las fechas created_at | updated_at
spring.jackson.time-zone=America/Lima
#desactivar advertencia open-in-view
spring.jpa.open-in-view=false

#Forzar a mostrar banner.txt - texto personalizado
spring.banner.location=classpath:banner.txt